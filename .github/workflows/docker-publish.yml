name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag override (e.g., v2.11.0)'
        required: false
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: .
            dockerfile: Dockerfile
            image: worldmonitor
            platforms: linux/amd64,linux/arm64
            # VITE_WS_API_URL was passed here pointing at the vendor API, but the
            # Dockerfile declares no such ARG, so it never reached the build.
            # Dropped rather than left to read as if the image were cloud-backed.
            build-args: |
              VITE_VARIANT=full
              VITE_UMAMI_SCRIPT_SRC=off
              VITE_COUNTRY_OVERRIDES_URL=/data/country-boundary-overrides.geojson
          - context: .
            dockerfile: Dockerfile.relay
            image: worldmonitor-ais-relay
            platforms: linux/amd64,linux/arm64
            build-args: ""
          - context: .
            dockerfile: docker/Dockerfile.redis-rest
            image: worldmonitor-redis-rest
            platforms: linux/amd64,linux/arm64
            build-args: ""
          # Runs scripts/seed-*.mjs for deployments with no scheduler of their
          # own — see the header of Dockerfile.seeder.
          - context: .
            dockerfile: Dockerfile.seeder
            image: worldmonitor-seeder
            platforms: linux/amd64,linux/arm64
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/zindaar/worldmonitor/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true